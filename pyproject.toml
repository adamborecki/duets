[project]
name = "duets"
version = "0.1.0"
description = "A generator of piano duets (four hands, one piano) from public-domain tunes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pypdf>=4"]

[project.optional-dependencies]
# only needed for the importers in tools/ and for the tests
dev = ["pytest", "mido", "music21"]

[project.scripts]
duets = "duets.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["duets"]

[tool.pytest.ini_options]
testpaths = ["tests"]
